<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Reset CarChief POC</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0a0a0a; color: #fafafa; }
      main { width: min(32rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #333; border-radius: 1rem; background: #171717; }
      h1 { margin-top: 0; }
      p { color: #d4d4d4; line-height: 1.6; }
      a { color: #f59e0b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Resetting the CarChief demo</h1>
      <p id="status" role="status" aria-live="polite">Clearing this browser's demo data and cache…</p>
      <noscript><p>JavaScript is required. Clear site data for this origin in your browser, then return to <a href="/">the Public Website</a>.</p></noscript>
    </main>
    <script>
      (async function resetDemo() {
        const status = document.getElementById('status');

        try {
          localStorage.clear();
          sessionStorage.clear();

          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
          }

          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          status.textContent = 'Reset complete. Loading fresh sample data…';
          window.setTimeout(() => window.location.replace('/?demoReset=1'), 400);
        } catch (error) {
          console.error('CarChief POC reset failed:', error);
          status.innerHTML = 'The automatic reset could not finish. Clear site data in your browser, then <a href="/">return to the Public Website</a>.';
        }
      })();
    </script>
  </body>
</html>
